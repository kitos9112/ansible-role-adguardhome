---
- name: Query DNS through the local AdGuard listener
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import os
        import socket
        import struct
        import sys
        import time

        def skip_name(packet, offset):
            while True:
                if offset >= len(packet):
                    raise ValueError
                label = packet[offset]
                if label & 0xc0 == 0xc0:
                    if offset + 1 >= len(packet):
                        raise ValueError
                    return offset + 2
                if label & 0xc0:
                    raise ValueError
                offset += 1
                if label == 0:
                    return offset
                offset += label

        try:
            address = sys.argv[1]
            port = int(sys.argv[2])
            domain = sys.argv[3].rstrip(".")
            timeout = float(sys.argv[4])
            labels = domain.encode("ascii").split(b".")
            if not labels or any(not label or len(label) > 63 for label in labels):
                raise ValueError
            qname = b"".join(bytes((len(label),)) + label for label in labels) + b"\0"
            question = qname + struct.pack("!HH", 1, 1)
            deadline = time.monotonic() + timeout
            while time.monotonic() < deadline:
                transaction = os.urandom(2)
                query = transaction + struct.pack("!HHHHH", 0x0100, 1, 0, 0, 0) + question
                try:
                    with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
                        sock.settimeout(min(0.5, max(0.05, deadline - time.monotonic())))
                        sock.connect((address, port))
                        sock.send(query)
                        response = sock.recv(4096)
                except socket.timeout:
                    continue
                if len(response) < 12 + len(question):
                    continue
                ident, flags, qdcount, ancount = struct.unpack_from("!HHHH", response)
                if ident != int.from_bytes(transaction, "big"):
                    continue
                if not flags & 0x8000 or flags & 0x7800 or flags & 0x0200:
                    continue
                if flags & 0x000f or qdcount != 1 or ancount < 1:
                    continue
                question_start = 12
                offset = question_start + len(question)
                if response[question_start:offset] != question:
                    continue
                found_a = False
                try:
                    for _ in range(ancount):
                        record_start = skip_name(response, offset)
                        if record_start + 10 > len(response):
                            raise ValueError
                        rtype, rclass, _, rdlength = struct.unpack_from(
                            "!HHIH", response, record_start
                        )
                        rdata_start = record_start + 10
                        record_end = rdata_start + rdlength
                        if record_end > len(response):
                            raise ValueError
                        if rtype == 1 and rclass == 1 and rdlength == 4:
                            found_a = True
                        offset = record_end
                except ValueError:
                    continue
                if found_a:
                    sys.exit(0)
            sys.exit(1)
        except Exception:
            sys.exit(1)
      - "{{ adguardhome_manage_dns_health_address }}"
      - "{{ adguardhome_manage_dns_health_port | string }}"
      - "{{ adguardhome_manage_dns_health_name }}"
      - "{{ adguardhome_manage_dns_health_timeout | string }}"
  register: adguardhome_manage_dns_health
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  diff: false

- name: Require a valid DNS response with an answer
  ansible.builtin.assert:
    that:
      - adguardhome_manage_dns_health.rc == 0
    fail_msg: "{{ adguardhome_manage_dns_failure_message }}"
  no_log: true
